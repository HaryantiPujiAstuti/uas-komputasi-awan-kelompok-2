name: CI - Test & Build Container

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f src/app/requirements.txt ]; then pip install -r src/app/requirements.txt; fi
          pip install pytest httpx

      - name: Verify model artifact & schema files exist
        run: |
          test -f src/app/model/model.joblib
          test -f src/app/model/features.json
          echo "Model and features schema verified successfully."

      - name: Run automated API tests (if available)
        run: |
          if ls src/app/test*.py 1> /dev/null 2>&1 || [ -d src/app/tests ]; then
            pytest src/app/
          else
            echo "No API tests found yet. Skipping pytest."
          fi

      - name: Test Docker image build (if Dockerfile exists)
        run: |
          if [ -f Dockerfile ]; then
            docker build -t abalone-predictor-api:ci-test .
          else
            echo "Dockerfile not found yet. Skipping Docker build."
          fi
